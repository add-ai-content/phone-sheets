var pins = [{"lat": 32.7957071, "lon": -97.4131539, "kind": "parking", "title": "Parking", "sub": "Trailhead lot - 2501 Roberts Cut Off Rd"}, {"lat": 32.791518, "lon": -97.414956, "kind": "dam", "title": "Lake Worth Dam", "sub": "North end of the dam, at the bluff"}, {"lat": 32.7899, "lon": -97.4153, "kind": "falls", "title": "Waterfall (approx)", "sub": "Below the dam, bottom of the Dam Drop"}, {"lat": 32.7974469, "lon": -97.4140495, "kind": "spotx", "title": "Spot X - Nov 12 (approx)", "sub": "Shooting spot by the dam end of the bluff"}, {"lat": 32.7975935, "lon": -97.4196218, "kind": "spoto", "title": "O bench - upper (approx)", "sub": "Closer along the rim, keeps the height"}, {"lat": 32.7970726, "lon": -97.4236491, "kind": "spoto", "title": "O bench - lower (approx)", "sub": "Farther along, partway down the face"}];

  maxZoom: 20, maxNativeZoom: 16, attribution: 'USGS The National Map'});
var otm = L.tileLayer('https://tile.opentopomap.org/{z}/{x}/{y}.png', {
  maxZoom: 17, maxNativeZoom: 15, attribution: 'OpenTopoMap (CC-BY-SA), SRTM'});
var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'});
var map = L.map('map', {layers: [topo]}).setView([32.7945, -97.4230], 15);
L.control.layers({'USGS Topo (feet)': topo, 'OpenTopoMap (meters)': otm, 'Street / trails': osm}, null, {collapsed: false}).addTo(map);
L.control.scale({imperial: true, metric: false}).addTo(map);
L.geoJSON(trails, {style: function(f){ return f.properties.name ?
  {color:'#b3001b', weight:3.5, opacity:.9} : {color:'#666', weight:1.6, opacity:.55}; },
  onEachFeature: function(f, l){ if (f.properties.name) {
    var c = l.getBounds().getCenter();
    L.tooltip({permanent: true, direction: 'center', className: 'trailname'}).setLatLng(c).setContent(f.properties.name).addTo(map); } }
}).addTo(map);

pins.forEach(function(p){

});
var me = null;
document.getElementById('loc').onclick = function(){ map.locate({setView: true, maxZoom: 17, watch: true}); };
map.on('locationfound', function(e){
  if (me) { me.setLatLng(e.latlng); } else {

});
